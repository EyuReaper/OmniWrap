version: 2
updates:
  # npm workspaces resolve through the single root lockfile (see AGENTS.md
  # "One lockfile, at the root") — apps/web has no lockfile of its own, so
  # this one entry covers the whole workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
